<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝花夕拾 鲁迅 著</title>
    <!-- 1. 引入 Turnstile JS，绑定全局加载回调 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</head>
<body>

    <!-- 你的图片标签 -->
    <img data-uuid="4a1d85b5-b729-4e7b-9933-ac33d828a52d.jpg" class="secure-img" alt="鲁迅肖像" style="min-height:50px; background:#f0f0f0; display:block; margin:10px 0;">

    <!-- 2. 🔴 核心修正：绝不能用 display:none！改用官方认可的离屏隐藏方式 -->
    <div id="turnstile-container" style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;"></div>

    <script>
    const WORKER_HOST = "https://mitc.1976473.xyz"; // 你的 CF Workers 域名
    const SITE_KEY = "0x4AAAAAADy-SV9SdOgpvt36";                   // 你申请到的公开 Sitekey

    console.log("页面已加载_等待Turnstile脚本初始化");

    /**
     * 3. Turnstile 脚本完全加载后触发
     */
    window.onTurnstileLoad = function () {
        console.log("Turnstile脚本加载成功_开始渲染验证器");
        
        try {
            turnstile.render('#turnstile-container', {
                sitekey: SITE_KEY,
                // 如果你的 Sitekey 在 CF 后台选的是 "Invisible"（隐式），这里可以填 "invisible"
                appearance: "always", 
                callback: function(turnstileToken) {
                    console.log("Turnstile验证成功_拿到Token", turnstileToken.substring(0, 20) + "...");
                    // 拿着 Token 去并发请求所有图片
                    loadAllImages(turnstileToken);
                },
                'error-callback': function(error) {
                    console.error('Turnstile验证器内部发生错误_可能Sitekey不匹配或域名未授权_错误信息', error);
                },
                'expired-callback': function() {
                    console.warn('TurnstileToken已过期_正在尝试重新验证');
                    turnstile.reset('#turnstile-container');
                }
            });
        } catch (e) {
            console.error("调用turnstile.render时发生崩溃", e);
        }
    };

    /**
     * 4. 请求 Worker 并换取图片
     */
    async function loadAllImages(turnstileToken) {
        const images = document.querySelectorAll('.secure-img');
        console.log(`开始为 ${images.length} 张图片申请安全链接`);
        
        const promises = Array.from(images).map(async (img, index) => {
            const uuid = img.getAttribute('data-uuid');
            if (!uuid) return;

            try {
                console.log(`[图片 ${index + 1}] 正在向Worker请求 ${uuid}`);
                const response = await fetch(`${WORKER_HOST}/get-img-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ turnstileToken, uuid })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log(`[图片 ${index + 1}] Worker验证通过_已拿到短效链接`);
                    // 拼接最终 URL
                    img.src = `${WORKER_HOST}/img/${uuid}?token=${data.token}&expires=${data.expires}`;
                } else {
                    console.error(`[图片 ${index + 1}] Worker拒绝了请求_状态码: ${response.status}_请检查Worker后台日志`);
                }
            } catch (err) {
                console.error(`[图片 ${index + 1}] 请求网络异常`, err);
            }
        });

        await Promise.all(promises);
    }
    </script>
    
    <!-- 1. 引入 GitHub Markdown 樣式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.min.css">
    
    <style>
        body {
            background-color: #f6f8fa;
            padding: 40px;
        }
        /* 新增导航列表样式 */
        .md-nav {
            max-width: 980px;
            margin: 0 auto 20px;
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
        }
        .md-nav h3 {
            margin-top: 0;
            color: #24292f;
        }
        .md-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .md-nav .md-item {
            padding: 8px 16px;
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: #0969da;
            text-decoration: none;
        }
        .md-nav .md-item:hover {
            background-color: #ddf4ff;
            border-color: #0969da;
        }
        .md-nav .md-item.active {
            background-color: #0969da;
            color: #ffffff;
            border-color: #0969da;
        }
        /* 限制渲染區域的最大寬度並置中，模擬文章排版 */
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
        }
        @media (max-width: 767px) {
            body {
                padding: 15px;
            }
            .markdown-body {
                padding: 15px;
            }
            .md-nav ul {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- 新增MD文件选择导航列表 -->
    <nav class="md-nav">
        <h3>选择类别</h3>
        <ul id="mdList">
            <!-- 你可以在这里自由扩展更多MD文件项 -->
            <li class="md-item" data-path=朝花夕拾.md">朝花夕拾</li>
        </ul>
    </nav>

    <!-- 渲染目標容器 -->
    <article id="content" class="markdown-body">載入中...</article>

    <!-- 3. 引入 DOMPurify (XSS 安全過濾) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
   <!-- 2. 引入 Marked.js (Markdown 解析) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    
    <!-- 4. 設定與引入 MathJax (數學公式) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\$', '\$']],
                displayMath: [['$$', '$$'], ['\$', '\$']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- 5. 核心 JavaScript：點擊對應項渲染指定md檔案 -->
    <script>
        async function loadAndRenderMarkdown(filePath) {
            try {
                // 使用 Fetch API 讀取目錄下的 md 文件
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`無法載入檔案: ${response.statusText}`);
                }
                const markdownText = await response.text();

                // 步驟 A：將 Markdown 轉為 HTML
                const rawHtml = marked.parse(markdownText);

                // 步驟 B：使用 DOMPurify 過濾惡意程式碼
                const cleanHtml = DOMPurify.sanitize(rawHtml);

                // 步驟 C：將結果放入畫面上
                const container = document.getElementById('content');
                container.innerHTML = cleanHtml;

                // 步驟 D：觸發 MathJax 重新掃描並渲染數學公式
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([container]).catch((err) => console.log(err));
                }

            } catch (error) {
                document.getElementById('content').innerHTML = `<p style="color: red;">發生錯誤: ${error.message}</p>`;
            }
        }

        // 綁定列表點擊事件
        const mdItems = document.querySelectorAll('.md-item');
        mdItems.forEach(item => {
            item.addEventListener('click', () => {
                // 清除所有項目的激活狀態
                mdItems.forEach(i => i.classList.remove('active'));
                // 給當前點擊的項目加上激活樣式
                item.classList.add('active');
                // 獲取對應的md文件路徑並載入渲染
                const targetPath = item.getAttribute('data-path');
                loadAndRenderMarkdown(targetPath);
            })
        })

        // 預設載入第一個MD文件
        mdItems.click();
    </script>
    <footer>
        <p>&copy; Czy | 本站托管于 GitHub Pages</p>
    </footer>
</body>
</html>
